name: Update stats

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Read-only fine-grained token (all repositories, Metadata + Contents: read).
      GH_TOKEN: ${{ secrets.STATS_TOKEN }}
      AUTHOR_EMAILS: ${{ secrets.AUTHOR_EMAILS }}
    steps:
      - uses: actions/checkout@v6
      - name: Render stats
        if: env.GH_TOKEN != ''
        run: python3 scripts/stats.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg
          git commit -m "Update stats" || exit 0
          git push
